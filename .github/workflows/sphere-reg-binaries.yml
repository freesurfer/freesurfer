name: sphere-reg binaries (mris_register)

# Builds the parallelized surface-registration tools (mris_register,
# mris_convert, mris_curvature) for macOS Intel and macOS Apple Silicon, and
# publishes ready-to-download binaries.
#
#   * every push / manual run  -> per-arch build artifacts (Actions tab)
#   * pushing a tag like v1.0  -> a GitHub Release with the binaries attached
#
# No local toolchain or know-how required: download the archive for your Mac,
# unpack, and run ./run.sh mris_register ...

on:
  push:
    branches: [ "claude/sphere-reg-pipeline-optimization-xtpgi7" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

# Supersede older runs on the same branch so their queued (often runner-starved)
# macOS jobs don't pile up competing for scarce hosted runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel (x86_64) is cross-built on the plentiful Apple-Silicon runner
          # via Rosetta, since GitHub's native macos-13 Intel runners are scarce.
          - { os: macos-14, name: macos-intel-x86_64, cross_x86: true }
          - { os: macos-14, name: macos-arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Build sphere-reg tools (native)
        if: ${{ !matrix.cross_x86 }}
        run: |
          chmod +x build_sphere_reg_pipeline.sh
          ./build_sphere_reg_pipeline.sh --jobs 3

      - name: Build sphere-reg tools (x86_64 cross on Apple Silicon)
        if: ${{ matrix.cross_x86 }}
        run: |
          # x86_64 Homebrew under /usr/local (via Rosetta), then run the same
          # build script under Rosetta so uname reports x86_64 and it uses the
          # x86_64 toolchain/deps.
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c \
              'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
          fi
          export PATH="/usr/local/bin:$PATH"
          chmod +x build_sphere_reg_pipeline.sh
          arch -x86_64 /bin/bash ./build_sphere_reg_pipeline.sh --jobs 3

      - name: Smoke test
        run: ./dist-freesurfer/run.sh mris_register 2>&1 | grep -iE "usage|input" | head -1 || true

      - name: Benchmark (serial vs all cores)
        run: |
          chmod +x scripts/bench_mris_register.sh
          ./scripts/bench_mris_register.sh

      - name: Package
        run: tar czf mris_register-${{ matrix.name }}.tgz -C dist-freesurfer .

      - uses: actions/upload-artifact@v4
        with:
          name: mris_register-${{ matrix.name }}
          path: mris_register-${{ matrix.name }}.tgz

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "mris_register-${{ matrix.name }}.tgz" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "mris_register-${{ matrix.name }}.tgz" \
                 --title "${GITHUB_REF_NAME}" --notes "mris_register binaries (Linux + macOS Intel/ARM)"
